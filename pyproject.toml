[project]
name = "py-data-analysis-basic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "access-modifiers>=0.3.1",
    "faker>=40.38.0",
    "ipywidgets>=8.1.9",
    "mimesis>=21.0.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pooch>=1.9.0",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "scipy-stubs>=1.18.1.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "git-changelog>=2.9.7",
    "ruff>=0.16.7",
]

[tool.git-changelog]
bump = "auto"
convention = "conventional"
in-place = false
filter-commits = ""
marker-line = "<!-- insertion marker for GitHub -->"
output = "CHANGELOG.md"
parse-refs = true
parse-trailers = true
provider = "github"
repository = "."
sections = ["feat", "fix", "chore", "docs", "perf", "build", "refactor", "test", "deps"]
template = "angular"
version-regex = "^## \\[(?P<version>v?[^\\]]+)"
versioning = "semver"
zerover = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["D203", "D213", "E501", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["py_iter_gen"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
